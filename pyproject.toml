[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "low-light-image-enhancement"
version = "1.0.0"
description = "Classical image enhancement baselines and a residual U-Net for low-light photography"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.1", "torchvision>=0.16", "numpy>=1.24", "Pillow>=10.0",
  "opencv-python-headless>=4.8", "scikit-image>=0.22", "tqdm>=4.66"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
